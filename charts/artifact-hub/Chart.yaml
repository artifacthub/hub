apiVersion: v2
name: artifact-hub
description: Artifact Hub is a web-based application that enables finding, installing, and publishing Cloud Native packages.
type: application
version: 1.24.1-0
appVersion: 1.24.0
kubeVersion: ">= 1.19.0-0"
home: https://artifacthub.io
icon: https://artifacthub.github.io/helm-charts/logo.png
keywords:
  - kubernetes
  - helm
  - falco
  - opa
  - olm
  - tinkerbell actions
  - krew
  - tekton
  - keda scalers
  - coredns
  - keptn
  - containers images
  - kubewarden
  - gatekeeper
  - kyverno
  - knative
  - backstage
  - argo
  - kubearmor
  - kcl
  - headlamp
  - inspektor gadget
  - meshery
  - opencost
  - radius
  - bootable containers
  - kagent
maintainers:
  - name: Sergio
    email: tegioz@icloud.com
  - name: Cintia
    email: cynthiasg@icloud.com
  - name: Matt
    email: matt@mattfarina.com
dependencies:
  - name: postgresql
    version: 18.0.15
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: Support for the helm.sh/images annotation in Helm charts
    - kind: added
      description: Analytics, data processing and web applications categories
    - kind: added
      description: Flag to ignore package versions in ah lint
    - kind: added
      description: Options to set scanner max image size and temporary directory (chart)
    - kind: changed
      description: Replace packages category classifier
    - kind: changed
      description: Scanner now pulls images itself and passes them to Trivy
    - kind: changed
      description: Skip images over the max size allowed in scanner
    - kind: changed
      description: Keep previous security report when scanning a snapshot fails
    - kind: changed
      description: Skip ignored packages in tracker sources
    - kind: changed
      description: Improve ah lint errors for Tekton git versioning
    - kind: changed
      description: Clarify official status definition and docs
    - kind: changed
      description: Do not retry scanner and tracker jobs when they fail (chart)
    - kind: changed
      description: Replace bitnamilegacy/kubectl with rancher/kubectl (chart)
    - kind: changed
      description: Tracker image is now based on Alpine
    - kind: changed
      description: Bump Alpine to 3.24.3
    - kind: changed
      description: Bump Go to 1.27.3
    - kind: changed
      description: Bump Trivy to 0.76.2
    - kind: changed
      description: Upgrade backend and frontend dependencies
    - kind: removed
      description: Support for OLM repositories stored in OCI registries
    - kind: fixed
      description: Security report crash on CVSS v4.0-only data
    - kind: security
      description: Enforce restricted HTTP client on all requests
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/images: |
    - name: db-migrator
      image: artifacthub/db-migrator:v1.24.0
    - name: hub
      image: artifacthub/hub:v1.24.0
    - name: tracker
      image: artifacthub/tracker:v1.24.0
    - name: scanner
      image: artifacthub/scanner:v1.24.0
    - name: trivy
      image: aquasec/trivy:0.76.2
  artifacthub.io/links: |
    - name: source
      url: https://github.com/artifacthub/hub
    - name: support
      url: https://github.com/artifacthub/hub/issues
  artifacthub.io/screenshots: |
    - title: Home page
      url: https://artifacthub.github.io/hub/screenshots/screenshot1.jpg
    - title: Packages search
      url: https://artifacthub.github.io/hub/screenshots/screenshot2.jpg
    - title: Package details
      url: https://artifacthub.github.io/hub/screenshots/screenshot3.jpg
    - title: Security report
      url: https://artifacthub.github.io/hub/screenshots/screenshot4.jpg
    - title: Values schema
      url: https://artifacthub.github.io/hub/screenshots/screenshot5.jpg
    - title: Changelog
      url: https://artifacthub.github.io/hub/screenshots/screenshot6.jpg
